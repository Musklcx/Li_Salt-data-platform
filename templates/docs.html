<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>锂盐车间共享平台 - 接口文档</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-unify.css') }}">
    <style>
        /* 顶部导航样式（与 data 等页面一致） */
        .top-nav { display: flex; gap: 2px; margin-bottom: 12px; }
        .nav-tab {
            padding: 12px 28px; background: #eee; color: #333;
            text-decoration: none; font-size: 16px;
            display: inline-block; cursor: pointer;
        }
        .nav-tab.active { background: #e74c3c; color: #fff; }
        .nav-dropdown { position: relative; }
        .nav-dropdown-menu {
            display: none; position: absolute; top: 100%; left: 0;
            background: #888; min-width: 220px; z-index: 999;
        }
        .nav-dropdown:hover .nav-dropdown-menu { display: block; }
        .nav-dropdown-menu a {
            display: block; padding: 12px 20px; color: #fff; text-decoration: none;
        }
        .nav-dropdown-menu a:hover { background: #666; }

        body { background: #f4f3ee; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
        .page-title { font-size: 20px; font-weight: 600; color: #1A1B1C; margin: 18px 0 14px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
        .toolbar input, .toolbar select {
            padding: 7px 12px; border: 1px solid #d0d5dd; border-radius: 6px;
            font-size: 13px; background: #fff; outline: none;
        }
        .toolbar input { width: 260px; }
        .doc-count { font-size: 13px; color: #6B7280; }
        .table-wrap { background: #fff; border: 1px solid #e4e3dd; border-radius: 10px; overflow: auto; }
        .table-wrap table { border-collapse: collapse; width: 100%; font-size: 13px; }
        .table-wrap thead th {
            background: #205493; color: #fff; padding: 10px 14px;
            text-align: left; font-weight: 600; position: sticky; top: 0; z-index: 2;
            white-space: nowrap;
        }
        .table-wrap tbody td {
            padding: 9px 14px; border-bottom: 1px solid #f0f0f0; color: #333;
            font-family: Consolas, monospace; font-size: 12.5px;
        }
        .table-wrap tbody tr:nth-child(even) { background: #fafafa; }
        .table-wrap tbody tr:hover { background: #eef4fb; }
        .method {
            display: inline-block; padding: 2px 10px; border-radius: 4px;
            color: #fff; font-size: 11.5px; font-weight: 600; font-family: Consolas, monospace;
        }
        .method.GET { background: #2e86de; }
        .method.POST { background: #20bf6b; }
        .method.PUT { background: #f0932b; }
        .method.DELETE { background: #eb4d4b; }
        .method.PATCH { background: #9b59b6; }
        .mod-tag { color: #6B7280; }
        .desc { color: #1A1B1C; }
        .empty-tip { padding: 30px; text-align: center; color: #9ca3af; }
    </style>
</head>
<body>
<div style="padding:16px;">
    <!-- 顶部导航 -->
    <div class="top-nav">
        <a href="/data" class="nav-tab">数据对比</a>
        <div class="nav-tab nav-dropdown">
            现场问题 <span style="font-size:12px;">▼</span>
            <div class="nav-dropdown-menu">
                <a href="/hazard">30吨蒸发问题汇总</a>
                <a href="/saferisks">安全隐患整改</a>
            </div>
        </div>
        <div class="nav-tab nav-dropdown">
            信息公示 <span style="font-size:12px;">▼</span>
            <div class="nav-dropdown-menu">
                <a href="/notice">班组工作量</a>
                <a href="/inventory">期末金属量</a>
            </div>
        </div>
        <a href="/staff" class="nav-tab">人员概况</a>
        <a href="/download" class="nav-tab">下载专区</a>
        <div class="nav-tab nav-dropdown">
            系统管理 <span style="font-size:12px;">▼</span>
            <div class="nav-dropdown-menu">
                <a href="/docs">接口文档</a>
                <a href="/logs">运行日志</a>
            </div>
        </div>
    </div>

    <div class="page-title">接口文档 <span class="doc-count" id="docCount"></span></div>

    <!-- 筛选工具条 -->
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="搜索路径 / 说明…">
        <select id="moduleSelect">
            <option value="">全部模块</option>
        </select>
        <span class="doc-count" id="filterTip"></span>
    </div>

    <!-- 接口表格 -->
    <div class="table-wrap">
        <table id="docTable">
            <thead>
                <tr>
                    <th style="width:90px;">方法</th>
                    <th style="width:50%;">接口路径</th>
                    <th style="width:130px;">模块</th>
                    <th>说明</th>
                </tr>
            </thead>
            <tbody id="docBody">
                <tr><td colspan="4"><div class="empty-tip">加载中…</div></td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="{{ url_for('static', filename='js/request.js') }}"></script>
<script src="{{ url_for('static', filename='js/nav_guard.js') }}"></script>
<script>
(function () {
    var allRoutes = [];
    var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
    function esc(s) { return String(s || '').replace(/[&<>]/g, function (c) { return ESC[c]; }); }

    function methodBadge(methods) {
        var m = methods.split(',')[0];
        return '<span class="method ' + m + '">' + esc(methods) + '</span>';
    }

    function render() {
        var kw = document.getElementById('searchInput').value.trim().toLowerCase();
        var mod = document.getElementById('moduleSelect').value;
        var list = allRoutes.filter(function (r) {
            if (mod && r.module !== mod) return false;
            if (kw && (r.path.toLowerCase().indexOf(kw) < 0) &&
                (r.desc.toLowerCase().indexOf(kw) < 0)) return false;
            return true;
        });
        var body = document.getElementById('docBody');
        document.getElementById('filterTip').textContent = '当前显示 ' + list.length + ' / ' + allRoutes.length + ' 个接口';
        if (!list.length) {
            body.innerHTML = '<tr><td colspan="4"><div class="empty-tip">没有匹配的接口</div></td></tr>';
            return;
        }
        body.innerHTML = list.map(function (r) {
            return '<tr>' +
                '<td>' + methodBadge(r.method) + '</td>' +
                '<td>' + esc(r.path) + '</td>' +
                '<td class="mod-tag">' + esc(r.module) + '</td>' +
                '<td class="desc">' + (r.desc ? esc(r.desc) : '—') + '</td>' +
                '</tr>';
        }).join('');
    }

    request.get('/api/docs').then(function (data) {
        allRoutes = data.routes || [];
        document.getElementById('docCount').textContent = '（共 ' + allRoutes.length + ' 个接口，自动生成）';
        // 模块下拉
        var mods = [];
        allRoutes.forEach(function (r) { if (mods.indexOf(r.module) < 0) mods.push(r.module); });
        var sel = document.getElementById('moduleSelect');
        mods.forEach(function (m) {
            var opt = document.createElement('option');
            opt.value = m; opt.textContent = m;
            sel.appendChild(opt);
        });
        render();
    }).catch(function (e) {
        document.getElementById('docBody').innerHTML =
            '<tr><td colspan="4"><div class="empty-tip">加载失败：' + esc(e.message) + '</div></td></tr>';
    });

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('moduleSelect').addEventListener('change', render);
})();
</script>
</body>
</html>
