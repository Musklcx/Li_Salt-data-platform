<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册</title>
    <link href="{{ url_for('static', filename='login_css/font-awesome.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='login_css/login.css') }}" rel="stylesheet">
</head>
<body>
    <!-- 漂浮气泡背景 -->
    <div class="bubbles" id="bubbles"></div>

    <div class="container" id="container">
        <div class="form-container sign-in">
            <form id="loginForm" autocomplete="off">
                <h1>登录</h1>
                <div class="platform-name">锂盐车间数据共享平台</div>
                <span>或使用您的邮箱密码</span>

                <!-- 消息提示条：JS 控制显示/隐藏和颜色 -->
                <div class="msg" id="loginMsg"></div>

                <input type="text" id="loginEmail" placeholder="Email" autocomplete="username">
                <div class="pwd-wrap">
                    <input type="password" id="loginPwd" placeholder="Password" autocomplete="current-password">
                    <i class="fa fa-eye-slash pwd-toggle" data-target="loginPwd" title="显示密码"></i>
                </div>
                <a href="#">忘记密码?</a>
                <button type="submit" id="loginBtn">登录</button>
            </form>
        </div>

        <div class="form-container sign-up">
            <form id="registerForm" autocomplete="off">
                <h1>创建账户</h1>
                <span>注册后即可使用全部功能</span>

                <div class="msg" id="regMsg"></div>

                <input type="text" id="regName" placeholder="用户名">
                <div class="code-row">
                    <input type="text" id="regEmail" placeholder="Email">
                    <button type="button" id="sendCodeBtn">获取验证码</button>
                </div>
                <div class="pwd-wrap">
                    <input type="password" id="regPwd" placeholder="密码（至少 6 位）" autocomplete="new-password">
                    <i class="fa fa-eye-slash pwd-toggle" data-target="regPwd" title="显示密码"></i>
                </div>
                <input type="text" id="regCode" placeholder="邮箱验证码（6 位数字）" maxlength="6" autocomplete="one-time-code">
                <button type="submit" id="regBtn">注册</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>欢迎回来!</h1>
                    <p>输入您的个人详细信息以使用网站的所有功能</p>
                    <button class="hidden" id="switchLogin">登录</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>你好，新朋友</h1>
                    <p>注册您的个人详细信息，以使用网站的所有功能</p>
                    <button class="hidden" id="switchRegister">注册</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const switchRegister = document.getElementById('switchRegister');
        const switchLogin = document.getElementById('switchLogin');
        const bubblesBox = document.getElementById('bubbles');

        // ---------- 背景气泡 ----------
        function createBubbles() {
            const sizes = ['small', 'medium', 'large'];
            for (let i = 0; i < 14; i++) {
                const bubble = document.createElement('div');
                const size = sizes[Math.floor(Math.random() * sizes.length)];
                bubble.classList.add('bubble', size);
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDuration = (8 + Math.random() * 12) + 's';
                bubble.style.animationDelay = (Math.random() * 6) + 's';
                bubblesBox.appendChild(bubble);
            }
        }
        createBubbles();

        // ---------- 左右切换 ----------
        switchRegister.addEventListener('click', () => container.classList.add('active'));
        switchLogin.addEventListener('click', () => container.classList.remove('active'));

        // ---------- 密码可见性切换（小眼睛） ----------
        document.querySelectorAll('.pwd-toggle').forEach(icon => {
            icon.addEventListener('click', () => {
                const input = document.getElementById(icon.dataset.target);
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                icon.classList.toggle('fa-eye', show);        // 明文时显示睁眼
                icon.classList.toggle('fa-eye-slash', !show); // 密文时显示闭眼
                icon.title = show ? '隐藏密码' : '显示密码';
            });
        });

        // ---------- 消息提示 ----------
        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'msg ' + (type === 'error' ? 'msg-error' : 'msg-ok');
            el.style.display = 'block';
        }
        function hideMsg(el) {
            el.style.display = 'none';
            el.textContent = '';
        }

        // ---------- 通用 fetch 封装 ----------
        async function postJSON(url, body) {
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.msg || '请求失败');
            return data;
        }

        // 按钮 loading：禁用 + 改文案，防止重复提交
        function setLoading(btn, loading, loadingText) {
            if (loading) {
                btn.dataset.originText = btn.textContent;
                btn.textContent = loadingText;
                btn.disabled = true;
            } else {
                btn.textContent = btn.dataset.originText || '提交';
                btn.disabled = false;
            }
        }

        // ---------- 注册 ----------
        const registerForm = document.getElementById('registerForm');
        const regMsg = document.getElementById('regMsg');
        const regBtn = document.getElementById('regBtn');
        const sendCodeBtn = document.getElementById('sendCodeBtn');

        // ---------- 发送验证码 + 60 秒倒计时 ----------
        let codeCountdown = null;   // 定时器句柄
        sendCodeBtn.addEventListener('click', async () => {
            const email = document.getElementById('regEmail').value.trim();
            if (!email) { showMsg(regMsg, '请先填写邮箱', 'error'); return; }

            sendCodeBtn.disabled = true;
            const originText = sendCodeBtn.textContent;
            sendCodeBtn.textContent = '发送中...';
            try {
                await postJSON('/api/register/send-code', { email });
                showMsg(regMsg, '验证码已发送，请查收邮件', 'ok');
                let left = 60;
                sendCodeBtn.textContent = left + 's 后重发';
                codeCountdown = setInterval(() => {
                    left -= 1;
                    if (left <= 0) {
                        clearInterval(codeCountdown);
                        codeCountdown = null;
                        sendCodeBtn.textContent = '获取验证码';
                        sendCodeBtn.disabled = false;
                    } else {
                        sendCodeBtn.textContent = left + 's 后重发';
                    }
                }, 1000);
            } catch (err) {
                showMsg(regMsg, err.message, 'error');
                sendCodeBtn.textContent = originText;
                sendCodeBtn.disabled = false;
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMsg(regMsg);
            const username = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPwd').value;
            const code = document.getElementById('regCode').value.trim();

            if (!username || !email || !password || !code) {
                showMsg(regMsg, '请填写完整信息（含验证码）', 'error');
                return;
            }

            setLoading(regBtn, true, '注册中...');
            try {
                const res = await postJSON('/api/register', { username, email, password, code });
                showMsg(regMsg, res.msg + '，请登录', 'ok');
                registerForm.reset();
                // 倒计时一并复位
                if (codeCountdown) { clearInterval(codeCountdown); codeCountdown = null; }
                sendCodeBtn.textContent = '获取验证码';
                sendCodeBtn.disabled = false;
                // 1.2 秒后自动切到登录页
                setTimeout(() => {
                    container.classList.remove('active');
                }, 1200);
            } catch (err) {
                showMsg(regMsg, err.message, 'error');
            } finally {
                setLoading(regBtn, false);
            }
        });

        // ---------- 登录 ----------
        const loginForm = document.getElementById('loginForm');
        const loginMsg = document.getElementById('loginMsg');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMsg(loginMsg);
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPwd').value;

            if (!email || !password) {
                showMsg(loginMsg, '请输入邮箱和密码', 'error');
                return;
            }

            setLoading(loginBtn, true, '登录中...');
            try {
                const res = await postJSON('/api/login', { email, password });
                // JWT 存 localStorage，后续请求放 Authorization 头
                localStorage.setItem('token', res.data.token);
                localStorage.setItem('user', JSON.stringify(res.data.user));
                showMsg(loginMsg, res.msg + '，正在跳转...', 'ok');
                setTimeout(() => { window.location.href = '/data'; }, 800);
            } catch (err) {
                showMsg(loginMsg, err.message, 'error');
            } finally {
                setLoading(loginBtn, false);
            }
        });

        // 如果已有未过期 token，直接跳 dashboard
        if (localStorage.getItem('token')) {
            // 不自动跳，让用户自己点；这里仅做预留
        }
    </script>
</body>
</html>
