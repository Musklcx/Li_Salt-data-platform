<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锂盐车间共享平台 - 水电汽消耗</title>

    <!-- ECharts -->
    <script src="{{ url_for('static', filename='lib/echarts/echarts.min.js') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/homeStyle.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dataCompar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/vendor/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/vendor/icofont/icofont.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-unify.css') }}">

    <style>
        /* ==========================================================
           整页布局：与 data 页一致（视口高度内排布，滚动只发生在表格内部）
           ========================================================== */
        html, body { height: 100%; }
        body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 16px;
            overflow: hidden;
            background: #f4f7fa;
        }

        /* 顶部导航（红） */
        .top-nav { display: flex; gap: 2px; flex: none; flex-wrap: wrap; }
        .nav-tab {
            padding: 11px 26px;
            background: #eee;
            color: #333;
            text-decoration: none;
            font-size: 15px;
            display: inline-block;
            cursor: pointer;
        }
        .nav-tab.active { background: #e74c3c; color: #fff; }
        .nav-dropdown { position: relative; }
        .nav-dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #888;
            min-width: 220px;
            z-index: 999;
        }
        .nav-dropdown:hover .nav-dropdown-menu { display: block; }
        .nav-dropdown-menu a { display: block; padding: 12px 20px; color: #fff; text-decoration: none; }
        .nav-dropdown-menu a:hover { background: #666; }

        /* KPI 卡片 */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            flex: none;
        }
        .kpi-card { background: #fff; border: 1px solid #ececec; border-radius: 8px; padding: 7px 14px; }
        .kpi-card .kpi-label { font-size: 12.5px; color: #8a8f99; margin-bottom: 2px; }
        .kpi-card .kpi-value { font-size: 19px; font-weight: 600; color: #2b579a; line-height: 1.35; }
        .kpi-card .kpi-value small { font-size: 12px; font-weight: 400; color: #aab0ba; margin-left: 3px; }
        .kpi-card .kpi-value .kpi-range { font-size: 12px; font-weight: 400; color: #aab0ba; margin-left: 8px; }
        .kpi-card .kpi-extra { font-size: 11.5px; color: #aab0ba; line-height: 1.5; }

        /* 控制条 */
        .top-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            row-gap: 8px;
            flex: none;
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 8px;
            padding: 8px 12px;
        }
        .top-row .spacer { flex: 1; }
        .metric-group > button, .mode-group > button {
            padding: 6px 15px;
            border: 1px solid #2b579a;
            background: #fff;
            color: #2b579a;
            border-radius: 6px;
            font-size: 13.5px;
            cursor: pointer;
            margin-right: 6px;
        }
        .metric-group > button.active, .mode-group > button.active { background: #2b579a; color: #fff; }
        .right-group { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
        .right-group button {
            padding: 6px 14px;
            border: 1px solid #4080ff;
            background: #fff;
            color: #4080ff;
            border-radius: 6px;
            font-size: 13.5px;
        }
        .right-group button.active { background: #2b579a; border-color: #2b579a; }
        .right-group input[type="date"] {
            padding: 5px 8px;
            border: 1px solid #dde0e6;
            border-radius: 6px;
            font-size: 13px;
            color: #444;
        }

        /* 主区域：左列上下两张趋势图，右列明细表（表格不拆分） */
        .page-main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(360px, 1fr);
            grid-template-rows: minmax(0, 1fr);
            gap: 12px;
        }
        .chart-col {
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            min-height: 0;
            min-width: 0;
        }
        /* 蒸汽/水只有一张图时占满整列 */
        .chart-col.single { grid-template-rows: minmax(0, 1fr); }
        .panel {
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }
        .p-head { display: flex; align-items: center; gap: 10px; flex: none; padding: 9px 14px; border-bottom: 1px solid #f0f2f5; }
        .p-title { font-size: 14px; font-weight: 600; color: #2f353d; }
        .p-sub { font-size: 12px; color: #9aa3b0; }
        .p-body { flex: 1; min-height: 0; position: relative; }
        #chart1, #chart2 {
            position: absolute;
            left: 0; top: 0;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            background: transparent;
            border-radius: 0;
        }

        /* 表格（右侧窄栏：列距收紧、表头用短名） */
        .table-scroll { flex: 1; min-height: 0; overflow: auto; }
        table.dt {
            width: 100%;
            margin: 0;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            font-size: 13px;
        }
        table.dt thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 9px 10px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            letter-spacing: .2px;
            text-align: right;
            white-space: nowrap;
            border: 0 !important;
            border-bottom: 1px solid #1a4275 !important;
            cursor: pointer;
            user-select: none;
        }
        table.dt thead th:hover { background: #2a63b0 !important; }
        table.dt thead th:first-child { text-align: left; }
        table.dt thead th .sort { color: rgba(255,255,255,.65); font-size: 11px; margin-left: 4px; font-weight: 400; }
        table.dt tbody td {
            padding: 9px 10px !important;
            font-size: 13px !important;
            text-align: right;
            white-space: nowrap;
            border: 0;
            border-bottom: 1px solid #f3f5f8;
            font-variant-numeric: tabular-nums;
            color: #2f353d;
        }
        table.dt tbody td:first-child { text-align: left; color: #4a5361; }
        table.dt tbody tr:nth-child(even) { background: #fcfdff; }
        table.dt tbody tr:hover { background: #f3f8ff; }
        /* 未录/插值标记 */
        table.dt tbody td.td-zero { color: #b3b9c3; }
        table.dt tbody td.td-est { background: #fdf6e7; color: #9c7a2e; }
        table.dt tbody td sup { color: #c99a2e; font-weight: 700; }
        /* 合计电量派生列 */
        table.dt tbody td.td-total { font-weight: 600; color: #2b579a; border-left: 1px dashed #e2e6ee; }
        table.dt tfoot td.td-total { color: #2b579a; border-left: 1px dashed #d5dbe5; }
        /* 电表 8 列时首列收窄 + 窄栏内横向滚动 */
        /* 电表列（含"合计电量"派生列时为 10 列） */
        table.dt[data-cols="10"] th:first-child,
        table.dt[data-cols="10"] td:first-child { width: 74px; }
        table.dt[data-cols="10"] { min-width: 730px; }
        table.dt[data-cols="9"] th:first-child,
        table.dt[data-cols="9"] td:first-child { width: 80px; }
        table.dt[data-cols="9"] { min-width: 700px; }
        table.dt[data-cols="5"] th:first-child,
        table.dt[data-cols="5"] td:first-child { width: 92px; }
        table.dt[data-cols="5"] { min-width: 500px; }
        table.dt[data-cols="3"] th:first-child,
        table.dt[data-cols="3"] td:first-child { width: 110px; }
        /* 合计行吸底 */
        table.dt tfoot td {
            position: sticky;
            bottom: 0;
            z-index: 2;
            background: #f7f9fc;
            padding: 9px 10px !important;
            font-size: 13px !important;
            text-align: right;
            white-space: nowrap;
            font-weight: 600;
            color: #2f353d;
            border: 0;
            border-top: 2px solid #e6eaf0 !important;
            font-variant-numeric: tabular-nums;
        }
        table.dt tfoot td:first-child { text-align: left; color: #6b7280; font-weight: 500; }
        .table-empty td {
            text-align: center !important;
            color: #aab0ba !important;
            padding: 40px 0 !important;
            font-size: 13.5px;
            background: #fff !important;
        }

        /* 上下布局（可切换，默认左右）：两张图并排在上、表格在下 */
        .page-main.stack {
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr);
        }
        .page-main.stack .chart-col {
            grid-template-rows: minmax(0, 1fr);
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        .page-main.stack .chart-col.single {
            grid-template-columns: minmax(0, 1fr);
        }

        /* 矮屏：允许整页滚动，保证图表与表格都有可用高度 */
        @media (max-height: 820px) {
            body { overflow: auto; }
            .page-main { min-height: 520px; }
        }
        /* 窄屏（如 1366 及以下的小窗）：回退为上下结构 */
        @media (max-width: 1180px) {
            .page-main {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(300px, 1.05fr) minmax(280px, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <a href="/data" class="nav-tab">数据对比</a>
        <div class="nav-tab nav-dropdown">
            现场问题 <span style="font-size:12px;">▼</span>
            <div class="nav-dropdown-menu">
                <a href="/hazard">30吨蒸发问题汇总</a>
                <a href="/saferisks">安全隐患整改</a>
                <a href="#" onclick="alert('未开发')">车间生产计划</a>
            </div>
        </div>
        <div class="nav-tab nav-dropdown active">
            信息公示 <span style="font-size:12px;">▼</span>
            <div class="nav-dropdown-menu">
                <a href="/notice">班组工作量</a>
                <a href="/inventory">期末金属量</a>
                <a href="/utilities">水电汽消耗</a>
            </div>
        </div>
        <a href="/staff" class="nav-tab">人员概况</a>
        <a href="/download" class="nav-tab">下载专区</a>

        <div class="nav-tab nav-dropdown">
            系统管理 <span style="font-size:12px;">▼</span>
            <div class="nav-dropdown-menu">
                <a href="/users">用户管理</a>
                <a href="/docs">接口文档</a>
                <a href="/logs">运行日志</a>
            </div>
        </div>
    </div>

    <!-- KPI 统计卡片 -->
    <div class="kpi-row">
        <div class="kpi-card">
            <div class="kpi-label">当前指标</div>
            <div class="kpi-value" style="font-size:17px;"><span id="curMetricName">用电</span><span class="kpi-range" id="kpiRange"></span></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label" id="kpiSumLabel">合计用量</div>
            <div class="kpi-value"><span id="kpiSumValue">0.00</span><small id="kpiSumUnit">kWh</small></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label" id="kpiLastLabel">最近一日</div>
            <div class="kpi-value"><span id="kpiLastValue">-</span><small id="kpiLastUnit">kWh</small></div>
        </div>
        <div class="kpi-card" id="kpiUnitCard" style="display:none;">
            <div class="kpi-label" id="kpiUnitLabel">吨锂电耗</div>
            <div class="kpi-value"><span id="kpiUnitValue">-</span><small id="kpiUnitSmall">kWh/t</small></div>
        </div>
    </div>

    <!-- 控制条 -->
    <div class="top-row">
        <div class="metric-group">
            <button data-key="elec" class="active">用电</button>
            <button data-key="steam">蒸汽</button>
            <button data-key="water">用水</button>
        </div>
        <span class="spacer"></span>
        <div class="right-group">
            <button id="btnLayout" title="图表与表格的排列方式">左右布局</button>
            <button id="btnDay" class="active">日</button>
            <button id="btnMonth">月</button>
            <button id="btnUsage" class="active">当日用量</button>
            <button id="btnReading">表底读数</button>
            <button id="btnLine" class="active">折线图</button>
            <button id="btnBar">柱状图</button>
            <button id="btnStack">堆叠柱状图</button>
            <input type="date" id="startDate">
            <input type="date" id="endDate">
            <button id="btnSearch">搜索</button>
            <button id="btnExport">导出Excel</button>
        </div>
    </div>

    <!-- 主区域：左列两张趋势图 + 右列明细表 -->
    <div class="page-main">
        <div class="chart-col" id="chartCol">
            <div class="panel" id="chartPanel1">
                <div class="p-head">
                    <span class="p-title" id="chartTitle1">趋势图</span>
                    <span class="p-sub" id="chartSub1"></span>
                </div>
                <div class="p-body">
                    <div id="chart1"></div>
                </div>
            </div>
            <div class="panel" id="chartPanel2">
                <div class="p-head">
                    <span class="p-title" id="chartTitle2">趋势图</span>
                    <span class="p-sub" id="chartSub2"></span>
                </div>
                <div class="p-body">
                    <div id="chart2"></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="table-scroll">
                <table class="table dt" id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                    <tfoot id="tableFoot"></tfoot>
                </table>
            </div>
        </div>
    </div>

<script src="{{ url_for('static',filename='assets/vendor/jquery/jquery.min.js') }}"></script>
<script src="{{ url_for('static',filename='assets/vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>

</body>
</html>
