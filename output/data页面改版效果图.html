<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据对比页改版效果图（静态演示）</title>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #f5f6f8;
            color: #333;
            padding: 16px;
            font-size: 14px;
        }

        /* ===== 顶部导航（与现版一致） ===== */
        .top-nav { display: flex; gap: 2px; margin-bottom: 14px; flex-wrap: wrap; }
        .nav-tab {
            padding: 11px 26px; background: #e4e6ea; color: #333;
            text-decoration: none; font-size: 15px; cursor: pointer;
            border-radius: 6px 6px 0 0; position: relative;
        }
        .nav-tab.active { background: #e74c3c; color: #fff; }
        .nav-dropdown-menu {
            display: none; position: absolute; top: 100%; left: 0;
            background: #888; min-width: 200px; z-index: 999;
        }
        .nav-dropdown { position: relative; }
        .nav-dropdown:hover .nav-dropdown-menu { display: block; }
        .nav-dropdown-menu a {
            display: block; padding: 10px 18px; color: #fff;
            text-decoration: none; font-size: 14px;
        }
        .nav-dropdown-menu a:hover { background: #666; }

        /* ===== KPI 卡片（新增样式） ===== */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 14px;
        }
        .kpi-card {
            background: #fff; border-radius: 8px;
            padding: 14px 18px;
            border: 1px solid #ececec;
        }
        .kpi-card .kpi-label { font-size: 13px; color: #8a8f99; margin-bottom: 6px; }
        .kpi-card .kpi-value { font-size: 24px; font-weight: 600; color: #2b2f36; }
        .kpi-card .kpi-value small { font-size: 12px; font-weight: 400; color: #aab0ba; margin-left: 4px; }
        .kpi-card .kpi-value.danger { color: #e74c3c; }
        .kpi-card .kpi-value .range { font-size: 12px; font-weight: 400; color: #aab0ba; margin-left: 8px; }
        /* 计划完成率卡片 */
        .kpi-card.plan { background: #eef4fc; border-color: #d6e4f7; }
        .plan-track { height: 8px; border-radius: 4px; background: #fff; overflow: hidden; margin-top: 8px; }
        .plan-fill { height: 100%; border-radius: 4px; background: #3782d8; width: 78%; }
        .plan-foot { font-size: 12px; color: #8a8f99; margin-top: 8px; }
        .plan-pct { font-size: 18px; font-weight: 600; color: #3782d8; }

        /* ===== 控制条 ===== */
        .top-row {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            background: #fff; border: 1px solid #ececec; border-radius: 8px;
            padding: 10px 12px; margin-bottom: 14px;
        }
        .top-row button {
            padding: 6px 16px; border: none; border-radius: 6px;
            background: #eef0f3; color: #444; font-size: 14px; cursor: pointer;
        }
        .top-row button.active { background: #e74c3c; color: #fff; }
        .top-row button.new-btn {
            background: #fff; border: 1px dashed #3782d8; color: #3782d8;
        }
        .top-row .sep { width: 1px; height: 20px; background: #e4e6ea; margin: 0 4px; }
        .top-row input[type="date"] {
            padding: 5px 8px; border: 1px solid #dde0e6; border-radius: 6px; font-size: 13px;
        }
        .top-row .spacer { flex: 1; }

        /* ===== 图表卡片 ===== */
        .chart-card {
            background: #fff; border: 1px solid #ececec; border-radius: 8px;
            padding: 12px; margin-bottom: 14px;
        }
        #chart { width: 100%; height: 420px; }
        .chart-note { font-size: 12px; color: #aab0ba; padding: 0 6px 4px; }

        /* ===== 表格（可排序表头 + 差值列） ===== */
        .table-card {
            background: #fff; border: 1px solid #ececec; border-radius: 8px;
            overflow: hidden; margin-bottom: 8px;
        }
        .table-wrap { max-height: 340px; overflow-y: auto; }
        .table-card table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .table-card thead th {
            position: sticky; top: 0; background: #f7f8fa; z-index: 1;
            padding: 10px 12px; text-align: center; font-weight: 500;
            border-bottom: 1px solid #e4e6ea; cursor: pointer; user-select: none;
        }
        .table-card thead th:hover { background: #eef0f3; }
        .table-card thead th .sort { color: #3782d8; font-size: 12px; margin-left: 4px; }
        .table-card td {
            padding: 8px 12px; text-align: center;
            border-bottom: 1px solid #f2f3f5;
        }
        .table-card tbody tr:hover { background: #fafbfc; }
        .diff-neg { color: #e74c3c; font-weight: 500; }
        .diff-pos { color: #2f9e6b; font-weight: 500; }
        .table-foot {
            display: flex; justify-content: space-between;
            font-size: 12px; color: #aab0ba; padding: 0 4px 10px;
        }
    </style>
</head>
<body>

<!-- 顶部导航：与现版结构一致 -->
<div class="top-nav">
    <a href="javascript:;" class="nav-tab active">数据对比</a>
    <div class="nav-tab nav-dropdown">现场问题 ▼
        <div class="nav-dropdown-menu">
            <a href="javascript:;">30吨蒸发问题汇总</a>
            <a href="javascript:;">安全隐患整改</a>
        </div>
    </div>
    <div class="nav-tab nav-dropdown">信息公示 ▼
        <div class="nav-dropdown-menu">
            <a href="javascript:;">班组工作量</a>
            <a href="javascript:;">期末金属量</a>
        </div>
    </div>
    <a href="javascript:;" class="nav-tab">人员概况</a>
    <a href="javascript:;" class="nav-tab">下载专区</a>
    <div class="nav-tab nav-dropdown" style="margin-left:auto;">系统管理 ▼
        <div class="nav-dropdown-menu">
            <a href="javascript:;">用户管理</a>
            <a href="javascript:;">接口文档</a>
            <a href="javascript:;">运行日志</a>
        </div>
    </div>
</div>

<!-- KPI 统计卡片（改版：替代原一行小字统计栏） -->
<div class="kpi-row">
    <div class="kpi-card">
        <div class="kpi-label">当前指标</div>
        <div class="kpi-value" style="font-size:18px;">碳酸锂<span class="range">09/01 – 10/26</span></div>
    </div>
    <div class="kpi-card">
        <div class="kpi-label">车间产出合计</div>
        <div class="kpi-value">1,286.40<small>t</small></div>
    </div>
    <div class="kpi-card">
        <div class="kpi-label">仓库出库合计</div>
        <div class="kpi-value">1,254.10<small>t</small></div>
    </div>
    <div class="kpi-card">
        <div class="kpi-label">差值（出库 − 产出）</div>
        <div class="kpi-value danger">−32.30<small>t</small></div>
    </div>
    <div class="kpi-card plan">
        <div class="kpi-label" style="color:#3782d8;">10月计划完成率</div>
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="plan-track" style="flex:1;"><div class="plan-fill"></div></div>
            <span class="plan-pct">78%</span>
        </div>
        <div class="plan-foot">计划 900.0 t · 已完成 702.6 t</div>
    </div>
</div>

<!-- 控制条：指标 / 粒度 / 图表类型 / 日期 -->
<div class="top-row">
    <button class="active">碳酸锂</button>
    <button>硫酸钠</button>
    <button>碳酸钠</button>
    <button>外排水</button>
    <div class="sep"></div>
    <button class="active">日</button>
    <button>月</button>
    <div class="sep"></div>
    <button class="active">折线图</button>
    <button>柱状图</button>
    <button class="new-btn">堆叠柱状图</button>
    <span class="spacer"></span>
    <input type="date" value="2026-09-01">
    <span style="color:#aab0ba;">→</span>
    <input type="date" value="2026-10-26">
    <button>搜索</button>
    <button>导出Excel</button>
</div>

<!-- 图表 -->
<div class="chart-card">
    <div id="chart"></div>
    <div class="chart-note">改版点：tooltip 增加当日差值展示；底部 dataZoom 缩略轴保留。</div>
</div>

<!-- 表格：可排序表头 + 当日差值列 -->
<div class="table-card">
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th data-sort="date">日期<span class="sort">↕</span></th>
                    <th data-sort="num">车间产出<span class="sort">↕</span></th>
                    <th data-sort="num">仓库出库<span class="sort">↕</span></th>
                    <th>当日差值</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>
<div class="table-foot">
    <span>改版点：表头点击排序 · 共 57 条记录</span>
    <span>空数据时显示「该日期范围内暂无数据」</span>
</div>

<script>
/* ===== 静态演示数据（模拟 56 天碳酸锂数据） ===== */
const MOCK = [];
(function () {
    let seed = 42;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const d = new Date(2026, 8, 1);
    for (let i = 0; i < 56; i++) {
        const output = 58 + rnd() * 30;
        const out = output + (rnd() - 0.5) * 14;
        MOCK.push({
            date: `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`,
            output: +output.toFixed(2),
            warehouse: +out.toFixed(2),
            diff: +(out - output).toFixed(2)
        });
        d.setDate(d.getDate() + 1);
    }
})();

/* ===== ECharts 折线图 ===== */
const chart = echarts.init(document.getElementById('chart'));
chart.setOption({
    tooltip: {
        trigger: 'axis',
        formatter: (params) => {
            const row = MOCK[params[0].dataIndex];
            let html = row.date + '<br/>';
            params.forEach(p => {
                html += `${p.marker}${p.seriesName}：${p.value.toFixed(2)} t<br/>`;
            });
            const c = row.diff < 0 ? '#e74c3c' : '#2f9e6b';
            html += `<span style="color:${c};font-weight:600;">当日差值：${row.diff > 0 ? '+' : ''}${row.diff.toFixed(2)} t</span>`;
            return html;
        }
    },
    legend: { top: 0 },
    grid: { left: 10, right: 20, top: 34, bottom: 60, containLabel: true },
    xAxis: { type: 'category', data: MOCK.map(r => r.date), boundaryGap: false, axisLabel: { fontSize: 11 } },
    yAxis: { type: 'value', name: 't', splitLine: { lineStyle: { color: '#eef1f5' } } },
    dataZoom: [{ type: 'slider', height: 20, bottom: 10, start: 30, end: 100 }],
    series: [
        {
            name: '车间产出', type: 'line', smooth: true, symbol: 'circle', symbolSize: 5,
            data: MOCK.map(r => r.output), itemStyle: { color: '#3782d8' },
            areaStyle: { opacity: 0.12 }, lineStyle: { width: 2.5 }
        },
        {
            name: '仓库出库', type: 'line', smooth: true, symbol: 'circle', symbolSize: 5,
            data: MOCK.map(r => r.warehouse), itemStyle: { color: '#e0a030' },
            areaStyle: { opacity: 0.12 }, lineStyle: { width: 2.5 }
        }
    ]
});
window.addEventListener('resize', () => chart.resize());

/* ===== 表格渲染 + 排序演示 ===== */
const tbody = document.getElementById('tableBody');
let sortState = { field: 'date', asc: false };

function renderTable() {
    const list = [...MOCK].sort((a, b) => {
        const va = sortState.field === 'date' ? a.date : a[sortState.field];
        const vb = sortState.field === 'date' ? b.date : b[sortState.field];
        const cmp = sortState.field === 'date' ? va.localeCompare(vb) : va - vb;
        return sortState.asc ? cmp : -cmp;
    });
    tbody.innerHTML = list.map(r => `
        <tr>
            <td>${r.date}</td>
            <td>${r.output.toFixed(2)}</td>
            <td>${r.warehouse.toFixed(2)}</td>
            <td class="${r.diff < 0 ? 'diff-neg' : 'diff-pos'}">${r.diff > 0 ? '+' : ''}${r.diff.toFixed(2)}</td>
        </tr>`).join('');
}
document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
        const field = th.dataset.sort;
        if (!field) return;
        if (sortState.field === field) sortState.asc = !sortState.asc;
        else sortState = { field, asc: false };
        document.querySelectorAll('.sort').forEach(s => s.textContent = '↕');
        th.querySelector('.sort').textContent = sortState.asc ? '↑' : '↓';
        renderTable();
    });
});
renderTable();

/* ===== 控制条按钮切换演示（纯视觉） ===== */
document.querySelectorAll('.top-row button').forEach(btn => {
    btn.addEventListener('click', () => {
        const group = btn.parentElement;
        const metricBtns = ['碳酸锂', '硫酸钠', '碳酸钠', '外排水'];
        const grainBtns = ['日', '月'];
        const chartBtns = ['折线图', '柱状图', '堆叠柱状图'];
        const g = metricBtns.includes(btn.textContent) ? metricBtns
                : grainBtns.includes(btn.textContent) ? grainBtns
                : chartBtns.includes(btn.textContent) ? chartBtns : null;
        if (!g) return;
        [...group.children].filter(b => b.tagName === 'BUTTON' && g.includes(b.textContent))
            .forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });
});
</script>
</body>
</html>
