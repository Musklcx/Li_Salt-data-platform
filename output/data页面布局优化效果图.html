<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据对比页 · 布局优化效果图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        background: #f4f7fa;
        color: #2f353d;
        font-size: 14px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: hidden;          /* 关键：整页不滚动，滚动交给图表/表格内部 */
    }

    /* ===== 顶部导航（保持红色） ===== */
    .top-nav { display: flex; gap: 2px; flex-wrap: wrap; flex: none; }
    .nav-tab {
        padding: 10px 24px; background: #e6e8ec; color: #333;
        text-decoration: none; font-size: 15px; cursor: pointer;
        border-radius: 6px 6px 0 0; position: relative;
    }
    .nav-tab.active { background: #e74c3c; color: #fff; }
    .nav-dropdown { position: relative; }
    .nav-dropdown-menu {
        display: none; position: absolute; top: 100%; left: 0;
        background: #888; min-width: 200px; z-index: 999;
    }
    .nav-dropdown:hover .nav-dropdown-menu { display: block; }
    .nav-dropdown-menu a { display: block; padding: 10px 18px; color: #fff; text-decoration: none; font-size: 14px; }
    .nav-dropdown-menu a:hover { background: #666; }

    /* ===== KPI 卡片 ===== */
    .kpi-row {
        display: grid;
        grid-template-columns: 1.05fr 1fr 1fr 1fr 1.25fr;
        gap: 10px; flex: none;
    }
    .kpi-card {
        background: #fff; border: 1px solid #ececec; border-radius: 8px;
        padding: 10px 14px;
    }
    .kpi-label { font-size: 12.5px; color: #8a8f99; margin-bottom: 5px; }
    .kpi-value { font-size: 21px; font-weight: 600; color: #2b579a; letter-spacing: .2px; }
    .kpi-value small { font-size: 12px; font-weight: 400; color: #aab0ba; margin-left: 3px; }
    .kpi-range { font-size: 12px; font-weight: 400; color: #aab0ba; margin-left: 8px; }
    .kpi-value.neg { color: #e74c3c; }
    .kpi-card.plan { background: #eef4fc; border-color: #d6e4f7; }
    .plan-track { height: 7px; border-radius: 4px; background: #fff; overflow: hidden; flex: 1; }
    .plan-fill { height: 100%; border-radius: 4px; background: #2b579a; transition: width .4s; }
    .plan-pct { font-size: 17px; font-weight: 600; color: #2b579a; }
    .plan-foot { font-size: 12px; color: #7d93b3; margin-top: 6px; }

    /* ===== 控制条 ===== */
    .top-row {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none;
        background: #fff; border: 1px solid #ececec; border-radius: 8px;
        padding: 8px 12px;
    }
    .top-row button {
        padding: 6px 15px; border: none; border-radius: 6px;
        background: #eef0f3; color: #444; font-size: 13.5px; cursor: pointer;
        transition: background .15s;
    }
    .top-row button:hover { background: #e3e7ee; }
    .top-row button.active { background: #2b579a; color: #fff; }
    .top-row .sep { width: 1px; height: 18px; background: #e4e6ea; margin: 0 3px; }
    .top-row input[type="date"] {
        padding: 5px 8px; border: 1px solid #dde0e6; border-radius: 6px; font-size: 13px; color: #444;
    }
    .top-row .spacer { flex: 1; }
    .top-row .btn-ghost { background: #fff; border: 1px solid #cfd8e6; color: #2b579a; }
    .top-row .btn-ghost:hover { background: #f2f7ff; }

    /* ===== 主区域：图表 + 表格 ===== */
    .page-main { flex: 1; min-height: 0; display: grid; gap: 12px; }
    /* 方案一：上下等分（推荐） */
    .layout-split .page-main { grid-template-rows: minmax(0, 1.05fr) minmax(0, 1fr); }
    /* 方案二：图表定高 380，表格吃满剩余 */
    .layout-fixed .page-main { grid-template-rows: 380px minmax(0, 1fr); }
    /* 方案三：左右分栏 */
    .layout-side .page-main {
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
    }

    .card {
        background: #fff; border: 1px solid #ececec; border-radius: 8px;
        display: flex; flex-direction: column; min-height: 0; min-width: 0;
        overflow: hidden;
    }
    .card-head {
        display: flex; align-items: center; gap: 10px; flex: none;
        padding: 9px 14px; border-bottom: 1px solid #f0f2f5;
    }
    .card-title { font-size: 14px; font-weight: 600; color: #2f353d; }
    .card-sub { font-size: 12px; color: #9aa3b0; }
    .card-head .spacer { flex: 1; }
    .seg { display: flex; background: #f2f4f8; border-radius: 6px; padding: 2px; }
    .seg button {
        border: none; background: transparent; padding: 4px 11px; font-size: 12.5px;
        color: #667080; border-radius: 4px; cursor: pointer;
    }
    .seg button.on { background: #fff; color: #2b579a; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .card-body { flex: 1; min-height: 0; position: relative; }
    #chart { width: 100%; height: 100%; }

    /* ===== 表格 ===== */
    .table-scroll { flex: 1; min-height: 0; overflow: auto; }
    table.dt {
        width: 100%; min-width: 640px; border-collapse: separate; border-spacing: 0;
        font-size: 13.5px; table-layout: fixed;
    }
    table.dt thead th {
        position: sticky; top: 0; z-index: 2;
        background: #f7f9fc; color: #6b7280;
        font-size: 12.5px; font-weight: 600; letter-spacing: .3px;
        padding: 11px 14px; text-align: right; white-space: nowrap;
        border-bottom: 1px solid #e6eaf0;
        cursor: pointer; user-select: none;
    }
    table.dt thead th:hover { background: #eef2f8; }
    table.dt thead th:first-child { text-align: left; }
    table.dt thead th .sort { color: #2b579a; font-size: 11px; margin-left: 5px; }
    table.dt tbody td {
        padding: var(--cell-py, 11px) 14px;
        text-align: right; white-space: nowrap;
        border-bottom: 1px solid #f3f5f8;
        font-variant-numeric: tabular-nums;
    }
    table.dt tbody td:first-child { text-align: left; color: #4a5361; }
    table.dt tbody tr:nth-child(even) { background: #fcfdff; }
    table.dt tbody tr:hover { background: #f3f8ff; }
    /* 差值列：单独隔开 + 药丸色块 */
    table.dt .col-sep { border-left: 1px solid #eef1f6; }
    .pill {
        display: inline-block; min-width: 74px; text-align: center;
        padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 13px;
    }
    .pill.neg { color: #d9483d; background: #fdeeec; }
    .pill.pos { color: #27905f; background: #eaf7f0; }
    .pill.zero { color: #8a8f99; background: #f2f4f7; }
    /* 合计行（吸底） */
    table.dt tfoot td {
        position: sticky; bottom: 0; z-index: 2;
        background: #f7f9fc; font-weight: 600; color: #2f353d;
        padding: 11px 14px; text-align: right; white-space: nowrap;
        border-top: 2px solid #e6eaf0;
        font-variant-numeric: tabular-nums;
    }
    table.dt tfoot td:first-child { text-align: left; color: #6b7280; font-weight: 500; }
    .table-empty td {
        text-align: center !important; color: #aab0ba; padding: 40px 0 !important; font-size: 13.5px;
    }
    .table-foot {
        flex: none; display: flex; justify-content: space-between; align-items: center;
        padding: 7px 14px; border-top: 1px solid #f0f2f5;
        font-size: 12px; color: #9aa3b0; background: #fcfdfe;
    }

    /* 密度 */
    .density-comfy table.dt { --cell-py: 11px; }
    .density-normal table.dt { --cell-py: 8px; }
    .density-tight table.dt { --cell-py: 5px; }

    .hint {
        flex: none; font-size: 12px; color: #8a94a3; padding-left: 2px;
    }
    .hint b { color: #2b579a; font-weight: 600; }
</style>
</head>
<body class="layout-split density-comfy">

<!-- 顶部导航（红色，保持原样） -->
<div class="top-nav">
    <a href="javascript:;" class="nav-tab active">数据对比</a>
    <div class="nav-tab nav-dropdown">现场问题 ▼
        <div class="nav-dropdown-menu">
            <a href="javascript:;">30吨蒸发问题汇总</a>
            <a href="javascript:;">安全隐患整改</a>
        </div>
    </div>
    <div class="nav-tab nav-dropdown">信息公示 ▼
        <div class="nav-dropdown-menu">
            <a href="javascript:;">班组工作量</a>
            <a href="javascript:;">期末金属量</a>
        </div>
    </div>
    <a href="javascript:;" class="nav-tab">人员概况</a>
    <a href="javascript:;" class="nav-tab">下载专区</a>
    <div class="nav-tab nav-dropdown">系统管理 ▼
        <div class="nav-dropdown-menu">
            <a href="javascript:;">用户管理</a>
            <a href="javascript:;">接口文档</a>
            <a href="javascript:;">运行日志</a>
        </div>
    </div>
</div>

<!-- KPI -->
<div class="kpi-row" id="kpiRow"></div>

<!-- 控制条 -->
<div class="top-row">
    <button data-metric="lithium" class="active">碳酸锂</button>
    <button data-metric="sulfate">硫酸钠</button>
    <button data-metric="carbonate">碳酸钠</button>
    <button data-metric="drain">外排水</button>
    <div class="sep"></div>
    <button class="active">日</button>
    <button>月</button>
    <div class="sep"></div>
    <button class="active">折线图</button>
    <button>柱状图</button>
    <button>堆叠柱状图</button>
    <span class="spacer"></span>
    <input type="date" value="2026-09-30">
    <span style="color:#aab0ba;">→</span>
    <input type="date" value="2026-10-27">
    <button>搜索</button>
    <button class="btn-ghost">导出 Excel</button>
</div>

<!-- 主区域 -->
<div class="page-main">
    <!-- 图表卡片 -->
    <div class="card">
        <div class="card-head">
            <span class="card-title" id="chartTitle">产量趋势</span>
            <span class="card-sub" id="chartSub">按日 · 单位 t</span>
            <span class="spacer"></span>
            <span class="card-sub" style="margin-right:4px;">布局</span>
            <div class="seg" id="segLayout">
                <button data-layout="split" class="on">上下等分</button>
                <button data-layout="fixed">图表定高</button>
                <button data-layout="side">左右分栏</button>
            </div>
        </div>
        <div class="card-body"><div id="chart"></div></div>
    </div>

    <!-- 表格卡片 -->
    <div class="card">
        <div class="card-head">
            <span class="card-title">明细数据</span>
            <span class="card-sub" id="tableSub">共 28 条</span>
            <span class="spacer"></span>
            <span class="card-sub" style="margin-right:4px;">行高</span>
            <div class="seg" id="segDensity">
                <button data-density="comfy" class="on">舒适</button>
                <button data-density="normal">标准</button>
                <button data-density="tight">紧凑</button>
            </div>
            <button class="btn-ghost" style="border:1px solid #cfd8e6;background:#fff;color:#2b579a;padding:4px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;">导出</button>
        </div>
        <div class="table-scroll">
            <table class="dt"><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table>
        </div>
        <div class="table-foot">
            <span>点击表头排序 · 底部合计行固定</span>
            <span id="footNote">数值右对齐、等宽数字</span>
        </div>
    </div>
</div>

<div class="hint">
    三个布局可实时切换：<b>上下等分</b>＝图表与表格各占一半，整页不滚动；<b>图表定高</b>＝图表固定 380px，表格吃满剩余；<b>左右分栏</b>＝图表左、表格右（7 列时略挤，可作参照）。
</div>

<script>
/* ===================== 演示数据 ===================== */
function seedRandom(s) { let x = s; return () => { x = (x * 9301 + 49297) % 233280; return x / 233280; }; }

const DATES = (() => {
    const arr = [], d = new Date(2026, 8, 30);
    for (let i = 0; i < 28; i++) {
        arr.push(`${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`);
        d.setDate(d.getDate() + 1);
    }
    return arr;
})();

const num = (v) => v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const METRICS = {
    lithium: {
        name: '碳酸锂', colTitle: '碳酸锂车间产出', unit: 't',
        cols: [
            { title: '日期', field: 'date', type: 'date', w: '18%' },
            { title: '车间产出', field: 'a', type: 'num', w: '27%' },
            { title: '仓库出库', field: 'b', type: 'num', w: '27%' },
            { title: '当日差值', field: 'diff', type: 'diff', w: '28%', sep: true }
        ],
        series: [{ field: 'a', name: '车间产出', color: '#2b579a' }, { field: 'b', name: '仓库出库', color: '#e0a030' }],
        diff: r => r.b - r.a,
        gen: (rnd) => { const a = 58 + rnd() * 30; return { a: +a.toFixed(2), b: +(a + (rnd() - 0.5) * 14).toFixed(2) }; }
    },
    sulfate: {
        name: '硫酸钠', colTitle: '硫酸钠日累计', unit: 't',
        cols: [
            { title: '日期', field: 'date', type: 'date', w: '14%' },
            { title: '日累计', field: 'a', type: 'num', w: '14.5%' },
            { title: '干料', field: 'dry', type: 'num', w: '13.5%' },
            { title: '湿料', field: 'wet', type: 'num', w: '13.5%' },
            { title: '杂质料', field: 'imp', type: 'num', w: '13.5%' },
            { title: '落地料', field: 'gnd', type: 'num', w: '13.5%' },
            { title: '当日差值', field: 'diff', type: 'diff', w: '17.5%', sep: true }
        ],
        series: [
            { field: 'dry', name: '干料', color: '#2b579a' },
            { field: 'wet', name: '湿料', color: '#1d9e75' },
            { field: 'imp', name: '杂质料', color: '#e0a030' },
            { field: 'gnd', name: '落地料', color: '#d9534f' }
        ],
        diff: r => r.a - (r.dry + r.wet + r.imp + r.gnd),
        gen: (rnd) => {
            const dry = 40 + rnd() * 22, wet = 8 + rnd() * 12, imp = 2 + rnd() * 5, gnd = 0.5 + rnd() * 3;
            const sum = dry + wet + imp + gnd;
            return { dry: +dry.toFixed(2), wet: +wet.toFixed(2), imp: +imp.toFixed(2), gnd: +gnd.toFixed(2), a: +(sum + (rnd() - 0.5) * 5).toFixed(2) };
        }
    },
    carbonate: {
        name: '碳酸钠', colTitle: '碳酸钠车间消耗', unit: 't',
        cols: [
            { title: '日期', field: 'date', type: 'date', w: '18%' },
            { title: '车间消耗', field: 'a', type: 'num', w: '27%' },
            { title: '仓库出库', field: 'b', type: 'num', w: '27%' },
            { title: '当日差值', field: 'diff', type: 'diff', w: '28%', sep: true }
        ],
        series: [{ field: 'a', name: '车间消耗', color: '#2b579a' }, { field: 'b', name: '仓库出库', color: '#e0a030' }],
        diff: r => r.b - r.a,
        gen: (rnd) => { const a = 12 + rnd() * 8; return { a: +a.toFixed(2), b: +(a + (rnd() - 0.5) * 4).toFixed(2) }; }
    },
    drain: {
        name: '外排水', colTitle: '外排水量', unit: 'm³',
        cols: [
            { title: '日期', field: 'date', type: 'date', w: '40%' },
            { title: '外排水量', field: 'a', type: 'num', w: '60%' }
        ],
        series: [{ field: 'a', name: '外排水量', color: '#2b579a' }],
        diff: null,
        gen: (rnd) => ({ a: +(180 + rnd() * 160).toFixed(2) })
    }
};

const DATA = {};
Object.keys(METRICS).forEach((key, ki) => {
    const rnd = seedRandom(2026 + ki * 31);
    DATA[key] = DATES.map(date => Object.assign({ date }, METRICS[key].gen(rnd)));
});

/* ===================== 状态 ===================== */
let curKey = 'lithium';
let sortState = { field: 'date', asc: true };
let chartType = 'line';

/* ===================== 图表 ===================== */
const chart = echarts.init(document.getElementById('chart'));
const ro = new ResizeObserver(() => chart.resize());
ro.observe(document.getElementById('chart'));

function renderChart() {
    const m = METRICS[curKey], rows = DATA[curKey];
    const showStack = false;
    chart.setOption({
        color: m.series.map(s => s.color),
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            formatter: params => {
                const r = rows[params[0].dataIndex];
                let html = `<div style="font-weight:600;margin-bottom:4px;">${r.date}</div>`;
                params.forEach(p => { html += `${p.marker}${p.seriesName}：<b>${num(p.value)}</b> ${m.unit}<br/>`; });
                if (m.diff) {
                    const d = m.diff(r), c = d < 0 ? '#d9483d' : '#27905f';
                    html += `<div style="margin-top:4px;padding-top:4px;border-top:1px dashed #e4e8ef;color:${c};font-weight:600;">当日差值：${d > 0 ? '+' : ''}${num(d)}</div>`;
                }
                return html;
            }
        },
        legend: { top: 4, itemWidth: 12, itemHeight: 8, textStyle: { fontSize: 12, color: '#6b7280' } },
        grid: { left: 8, right: 18, top: 40, bottom: 48, containLabel: true },
        xAxis: {
            type: 'category', boundaryGap: chartType === 'bar', data: rows.map(r => r.date),
            axisLine: { lineStyle: { color: '#e2e7ef' } },
            axisTick: { show: false },
            axisLabel: { fontSize: 11, color: '#8a94a3', formatter: v => v.slice(5) }
        },
        yAxis: {
            type: 'value', name: m.unit, nameTextStyle: { color: '#9aa3b0', fontSize: 11 },
            axisLine: { show: false }, axisTick: { show: false },
            axisLabel: { fontSize: 11, color: '#8a94a3' },
            splitLine: { lineStyle: { color: '#f0f3f7' } }
        },
        dataZoom: [{ type: 'slider', height: 16, bottom: 10, borderColor: 'transparent',
            backgroundColor: '#f4f7fa', fillerColor: 'rgba(43,87,154,.10)',
            handleStyle: { color: '#2b579a' }, start: 0, end: 100 }],
        series: m.series.map(s => ({
            name: s.name, type: chartType, smooth: chartType === 'line',
            symbol: 'circle', symbolSize: 5, barMaxWidth: 18,
            data: rows.map(r => r[s.field]),
            itemStyle: { color: s.color, borderRadius: chartType === 'bar' ? [3, 3, 0, 0] : 0 },
            lineStyle: { width: 2.4 },
            areaStyle: chartType === 'line' && m.series.length <= 2 ? { opacity: .10 } : undefined
        }))
    }, true);
}

/* ===================== KPI ===================== */
function renderKpi() {
    const m = METRICS[curKey], rows = DATA[curKey];
    const sum = f => rows.reduce((s, r) => s + (r[f] || 0), 0);
    const cards = [];
    cards.push(`<div class="kpi-card"><div class="kpi-label">当前指标</div>
        <div class="kpi-value" style="font-size:17px;">${m.name}<span class="kpi-range">09/30 – 10/27</span></div></div>`);

    if (curKey === 'sulfate') {
        cards.push(`<div class="kpi-card"><div class="kpi-label">日累计合计</div><div class="kpi-value">${num(sum('a'))}<small>t</small></div></div>`);
        cards.push(`<div class="kpi-card"><div class="kpi-label">四料合计（干/湿/杂/落地）</div><div class="kpi-value" style="font-size:16px;">${num(sum('dry') + sum('wet') + sum('imp') + sum('gnd'))}<small>t</small></div></div>`);
    } else {
        cards.push(`<div class="kpi-card"><div class="kpi-label">${m.colTitle}合计</div><div class="kpi-value">${num(sum('a'))}<small>${m.unit}</small></div></div>`);
        cards.push(`<div class="kpi-card"><div class="kpi-label">仓库出库合计</div><div class="kpi-value">${num(sum('b'))}<small>${m.unit}</small></div></div>`);
    }

    if (m.diff) {
        const d = rows.reduce((s, r) => s + m.diff(r), 0);
        cards.push(`<div class="kpi-card"><div class="kpi-label">差值（区间累计）</div>
            <div class="kpi-value ${d < 0 ? 'neg' : ''}">${d > 0 ? '+' : ''}${num(d)}<small>${m.unit}</small></div></div>`);
    } else {
        cards.push(`<div class="kpi-card"><div class="kpi-label">日均排水量</div><div class="kpi-value">${num(sum('a') / rows.length)}<small>m³</small></div></div>`);
    }

    if (curKey === 'lithium' || curKey === 'sulfate') {
        const plan = curKey === 'lithium' ? 900 : 1200;
        const done = sum('a'), pct = Math.min(100, Math.round(done / plan * 100));
        cards.push(`<div class="kpi-card plan"><div class="kpi-label" style="color:#2b579a;">10月计划完成率</div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="plan-track"><div class="plan-fill" style="width:${pct}%"></div></div>
                <span class="plan-pct">${pct}%</span>
            </div>
            <div class="plan-foot">计划 ${plan} t · 已完成 ${num(done)} t</div></div>`);
    } else {
        cards.push(`<div class="kpi-card"><div class="kpi-label">记录天数</div><div class="kpi-value">${rows.length}<small>天</small></div></div>`);
    }
    document.getElementById('kpiRow').innerHTML = cards.join('');
}

/* ===================== 表格 ===================== */
function sortRows() {
    const rows = [...DATA[curKey]];
    const f = sortState.field;
    return rows.sort((x, y) => {
        let c;
        if (f === 'date') c = x.date.localeCompare(y.date);
        else c = (x[f] || 0) - (y[f] || 0);
        return sortState.asc ? c : -c;
    });
}

function renderTable() {
    const m = METRICS[curKey];
    const head = document.getElementById('thead');
    const body = document.getElementById('tbody');
    const foot = document.getElementById('tfoot');

    head.innerHTML = '<tr>' + m.cols.map(c => {
        const sortable = c.type !== 'diff';
        return `<th ${c.sep ? 'class="col-sep"' : ''} data-field="${c.field}" data-sortable="${sortable ? 1 : 0}" style="width:${c.w}">
            ${c.title}${sortable ? `<span class="sort">${sortState.field === c.field ? (sortState.asc ? '↑' : '↓') : '↕'}</span>` : ''}</th>`;
    }).join('') + '</tr>';

    head.querySelectorAll('th').forEach(th => {
        if (th.dataset.sortable !== '1') return;
        th.onclick = () => {
            const f = th.dataset.field;
            if (sortState.field === f) sortState.asc = !sortState.asc;
            else sortState = { field: f, asc: f === 'date' };
            renderTable();
        };
    });

    const rows = sortRows();
    body.innerHTML = rows.map(r => '<tr>' + m.cols.map(c => {
        if (c.type === 'date') return `<td>${r.date}</td>`;
        if (c.type === 'diff') {
            const d = m.diff ? m.diff(r) : 0;
            const cls = Math.abs(d) < 0.0001 ? 'zero' : (d < 0 ? 'neg' : 'pos');
            return `<td class="col-sep"><span class="pill ${cls}">${d > 0 ? '+' : ''}${num(d)}</span></td>`;
        }
        return `<td>${num(r[c.field])}</td>`;
    }).join('') + '</tr>').join('');

    // 合计行
    const sums = {};
    m.cols.forEach(c => {
        if (c.type === 'num') sums[c.field] = rows.reduce((s, r) => s + (r[c.field] || 0), 0);
    });
    let totalDiff = m.diff ? rows.reduce((s, r) => s + m.diff(r), 0) : null;
    foot.innerHTML = '<tr>' + m.cols.map((c, i) => {
        if (i === 0) return '<td>合计</td>';
        if (c.type === 'diff') return `<td class="col-sep">${totalDiff > 0 ? '+' : ''}${num(totalDiff)}</td>`;
        return `<td>${num(sums[c.field])}</td>`;
    }).join('') + '</tr>';

    document.getElementById('tableSub').innerText = `共 ${rows.length} 条`;
}

/* ===================== 渲染 & 交互 ===================== */
function renderAll() {
    const m = METRICS[curKey];
    document.getElementById('chartTitle').innerText = m.name + '趋势';
    document.getElementById('chartSub').innerText = '按日 · 单位 ' + m.unit;
    renderKpi();
    renderChart();
    renderTable();
}

document.querySelectorAll('.top-row [data-metric]').forEach(btn => {
    btn.onclick = () => {
        curKey = btn.dataset.metric;
        sortState = { field: 'date', asc: true };
        document.querySelectorAll('.top-row [data-metric]').forEach(b => b.classList.toggle('active', b === btn));
        renderAll();
    };
});

document.getElementById('segLayout').onclick = e => {
    const btn = e.target.closest('button'); if (!btn) return;
    document.body.className = document.body.className.replace(/layout-\w+/, 'layout-' + btn.dataset.layout);
    document.querySelectorAll('#segLayout button').forEach(b => b.classList.toggle('on', b === btn));
    chart.resize();
};

document.getElementById('segDensity').onclick = e => {
    const btn = e.target.closest('button'); if (!btn) return;
    document.body.className = document.body.className.replace(/density-\w+/, 'density-' + btn.dataset.density);
    document.querySelectorAll('#segDensity button').forEach(b => b.classList.toggle('on', b === btn));
};

// 折线/柱状切换（演示）
document.querySelectorAll('.top-row button').forEach(btn => {
    const t = btn.textContent.trim();
    if (t === '折线图' || t === '柱状图' || t === '堆叠柱状图') {
        btn.onclick = () => {
            const group = ['折线图', '柱状图', '堆叠柱状图'];
            document.querySelectorAll('.top-row button').forEach(b => {
                if (group.includes(b.textContent.trim())) b.classList.remove('active');
            });
            btn.classList.add('active');
            chartType = t === '折线图' ? 'line' : 'bar';
            renderChart();
        };
    }
});

window.addEventListener('resize', () => chart.resize());

renderAll();
</script>
</body>
</html>
