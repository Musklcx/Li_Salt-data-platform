<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>data 页 · 实现预览（与真实页面同 CSS）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
    /* ====== 以下样式与 templates/data.html 中的实现保持一致 ====== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        display: flex; flex-direction: column; gap: 10px;
        padding: 12px 16px; overflow: hidden; background: #f4f7fa; color: #333;
    }
    .top-nav { display: flex; gap: 2px; flex: none; flex-wrap: wrap; }
    .nav-tab {
        padding: 11px 26px; background: #eee; color: #333;
        font-size: 15px; display: inline-block; cursor: pointer; text-decoration: none;
    }
    .nav-tab.active { background: #e74c3c; color: #fff; }

    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; flex: none; }
    .kpi-card { background: #fff; border: 1px solid #ececec; border-radius: 8px; padding: 10px 14px; }
    .kpi-label { font-size: 12.5px; color: #8a8f99; margin-bottom: 5px; }
    .kpi-value { font-size: 21px; font-weight: 600; color: #2b579a; line-height: 1.3; }
    .kpi-value small { font-size: 12px; font-weight: 400; color: #aab0ba; margin-left: 3px; }
    .kpi-range { font-size: 12px; font-weight: 400; color: #aab0ba; margin-left: 8px; }
    .kpi-value.neg { color: #e74c3c; }
    .kpi-card.plan { background: #eef4fc; border-color: #d6e4f7; }
    .plan-track { height: 7px; border-radius: 4px; background: #fff; overflow: hidden; }
    .plan-fill { height: 100%; border-radius: 4px; background: #2b579a; }
    .plan-pct { font-size: 17px; font-weight: 600; color: #2b579a; }
    .plan-foot { font-size: 12px; color: #7d93b3; margin-top: 6px; }

    .top-row {
        display: flex; align-items: center; gap: 8px; flex: none;
        background: #fff; border: 1px solid #ececec; border-radius: 8px; padding: 8px 12px;
    }
    .top-row .spacer { flex: 1; }
    .metric-group > button {
        padding: 6px 15px; border: 1px solid #2b579a; background: #fff; color: #2b579a;
        border-radius: 6px; font-size: 13.5px; cursor: pointer; margin-right: 6px;
    }
    .metric-group > button.active { background: #2b579a; color: #fff; }
    .right-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .right-group button {
        padding: 6px 14px; border: 1px solid #4080ff; background: #fff; color: #4080ff;
        border-radius: 6px; font-size: 13.5px; cursor: pointer;
    }
    .right-group button.active { background: #2b579a; border-color: #2b579a; color: #fff; }
    .right-group input[type="date"] { padding: 5px 8px; border: 1px solid #dde0e6; border-radius: 6px; font-size: 13px; color: #444; }

    .page-main { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; }
    .panel {
        background: #fff; border: 1px solid #ececec; border-radius: 8px;
        display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
    }
    .p-head { display: flex; align-items: center; gap: 10px; flex: none; padding: 9px 14px; border-bottom: 1px solid #f0f2f5; }
    .p-title { font-size: 14px; font-weight: 600; color: #2f353d; }
    .p-sub { font-size: 12px; color: #9aa3b0; }
    .p-head .spacer { flex: 1; }
    .p-body { flex: 1; min-height: 0; position: relative; }
    #chart { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

    .table-scroll { flex: 1; min-height: 0; overflow: auto; }
    table.dt { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13.5px; }
    table.dt thead th {
        position: sticky; top: 0; z-index: 2;
        background: #205493; color: #fff;
        padding: 11px 14px !important; font-size: 12.5px !important; font-weight: 600 !important;
        letter-spacing: .3px; text-align: right; white-space: nowrap;
        border: 0 !important; border-bottom: 1px solid #1a4275 !important;
        cursor: pointer; user-select: none;
    }
    table.dt thead th:hover { background: #2a63b0 !important; }
    table.dt thead th:first-child { text-align: left; }
    table.dt thead th .sort { color: rgba(255,255,255,.65); font-size: 11px; margin-left: 5px; font-weight: 400; }
    table.dt tbody td {
        padding: 11px 14px !important; font-size: 13.5px !important;
        text-align: right; white-space: nowrap;
        border: 0; border-bottom: 1px solid #f3f5f8;
        font-variant-numeric: tabular-nums; color: #2f353d;
    }
    table.dt tbody td:first-child { text-align: left; color: #4a5361; }
    table.dt tbody tr:nth-child(even) { background: #fcfdff; }
    table.dt tbody tr:hover { background: #eef3fb; }
    table.dt th:first-child, table.dt td:first-child { width: 15%; }
    table.dt[data-cols="2"] th:first-child, table.dt[data-cols="2"] td:first-child { width: 45%; }
    table.dt .col-sep { border-left: 1px solid #eef1f6; }
    .dt .pill {
        display: inline-block; min-width: 74px; text-align: center;
        padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 13px;
    }
    .dt .pill.neg { color: #d9483d; background: #fdeeec; }
    .dt .pill.pos { color: #27905f; background: #eaf7f0; }
    .dt .pill.zero { color: #8a8f99; background: #f2f4f7; }
    table.dt tfoot td {
        position: sticky; bottom: 0; z-index: 2; background: #f7f9fc;
        padding: 11px 14px !important; font-size: 13.5px !important;
        text-align: right; white-space: nowrap; font-weight: 600; color: #2f353d;
        border: 0; border-top: 2px solid #e6eaf0 !important;
        font-variant-numeric: tabular-nums;
    }
    table.dt tfoot td:first-child { text-align: left; color: #6b7280; font-weight: 500; }
    table.dt tfoot td.tf-neg { color: #d9483d; }
    table.dt tfoot td.tf-pos { color: #27905f; }
    @media (max-height: 820px) {
        body { overflow: auto; }
        .page-main { grid-template-rows: 320px 460px; }
    }
</style>
</head>
<body>

<div class="top-nav">
    <a href="javascript:;" class="nav-tab active">数据对比</a>
    <div class="nav-tab">现场问题 ▼</div>
    <div class="nav-tab">信息公示 ▼</div>
    <a href="javascript:;" class="nav-tab">人员概况</a>
    <a href="javascript:;" class="nav-tab">下载专区</a>
    <div class="nav-tab">系统管理 ▼</div>
</div>

<div class="kpi-row" id="kpiRow"></div>

<div class="top-row">
    <div class="metric-group" id="metricGroup">
        <button data-key="lithium" class="active">碳酸锂</button>
        <button data-key="sulfate">硫酸钠</button>
        <button data-key="carbonate">碳酸钠</button>
        <button data-key="drain">外排水</button>
    </div>
    <span class="spacer"></span>
    <div class="right-group">
        <button class="active">日</button>
        <button>月</button>
        <button class="active">折线图</button>
        <button>柱状图</button>
        <button>堆叠柱状图</button>
        <input type="date" value="2026-09-30">
        <input type="date" value="2026-10-27">
        <button>搜索</button>
        <button>导出Excel</button>
    </div>
</div>

<div class="page-main">
    <div class="panel">
        <div class="p-head">
            <span class="p-title" id="chartTitle">碳酸锂趋势</span>
            <span class="p-sub" id="chartSub">按日 · 单位 t</span>
        </div>
        <div class="p-body"><div id="chart"></div></div>
    </div>

    <div class="panel">
        <div class="p-head">
            <span class="p-title">明细数据</span>
            <span class="p-sub" id="tableCount">共 0 条记录</span>
            <span class="spacer"></span>
            <span class="p-sub">点击表头可排序 · 底部合计行固定</span>
        </div>
        <div class="table-scroll">
            <table class="dt" id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFoot"></tfoot>
            </table>
        </div>
    </div>
</div>

<script>
/* ===== 模拟数据（与真实接口字段同名，便于对照） ===== */
function rndGen(seed) { let x = seed; return () => { x = (x * 9301 + 49297) % 233280; return x / 233280; }; }
const DATES = (() => {
    const arr = [], d = new Date(2026, 8, 30);
    for (let i = 0; i < 28; i++) {
        arr.push(`${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`);
        d.setDate(d.getDate() + 1);
    }
    return arr;
})();

const METRICS = {
    lithium: {
        name: '碳酸锂', unit: 't',
        cols: [
            { title: '日期', field: '日期' },
            { title: '碳酸锂车间产出', field: '碳酸锂车间产出' },
            { title: '碳酸锂仓库出库', field: '碳酸锂仓库出库' },
            { title: '当日差值', field: 'diff', isDiff: true }
        ],
        series: [
            { field: '碳酸锂车间产出', name: '碳酸锂车间产出', color: '#2b579a' },
            { field: '碳酸锂仓库出库', name: '碳酸锂仓库出库', color: '#e0a030' }
        ],
        diff: r => r['碳酸锂仓库出库'] - r['碳酸锂车间产出'],
        gen: rnd => { const a = 58 + rnd() * 30; return { '碳酸锂车间产出': +a.toFixed(2), '碳酸锂仓库出库': +(a + (rnd() - 0.5) * 14).toFixed(2) }; }
    },
    sulfate: {
        name: '硫酸钠', unit: 't',
        cols: [
            { title: '日期', field: '日期' },
            { title: '硫酸钠日累计', field: '硫酸钠' },
            { title: '干料', field: '硫酸钠干料' },
            { title: '湿料', field: '硫酸钠湿料' },
            { title: '杂质料', field: '硫酸钠杂质料' },
            { title: '落地料', field: '硫酸钠落地料' },
            { title: '当日差值', field: 'diff', isDiff: true }
        ],
        series: [
            { field: '硫酸钠干料', name: '干料', color: '#2b579a' },
            { field: '硫酸钠湿料', name: '湿料', color: '#1d9e75' },
            { field: '硫酸钠杂质料', name: '杂质料', color: '#e0a030' },
            { field: '硫酸钠落地料', name: '落地料', color: '#d9534f' }
        ],
        diff: r => r['硫酸钠'] - (r['硫酸钠干料'] + r['硫酸钠湿料'] + r['硫酸钠杂质料'] + r['硫酸钠落地料']),
        gen: rnd => {
            const dry = 40 + rnd() * 22, wet = 8 + rnd() * 12, imp = 2 + rnd() * 5, gnd = 0.5 + rnd() * 3;
            const s = dry + wet + imp + gnd;
            return { '硫酸钠干料': +dry.toFixed(2), '硫酸钠湿料': +wet.toFixed(2), '硫酸钠杂质料': +imp.toFixed(2),
                     '硫酸钠落地料': +gnd.toFixed(2), '硫酸钠': +(s + (rnd() - 0.5) * 5).toFixed(2) };
        }
    },
    carbonate: {
        name: '碳酸钠', unit: 't',
        cols: [
            { title: '日期', field: '日期' },
            { title: '碳酸钠车间消耗', field: '碳酸钠车间消耗' },
            { title: '碳酸钠仓库出库', field: '碳酸钠仓库出库' },
            { title: '当日差值', field: 'diff', isDiff: true }
        ],
        series: [
            { field: '碳酸钠车间消耗', name: '碳酸钠车间消耗', color: '#2b579a' },
            { field: '碳酸钠仓库出库', name: '碳酸钠仓库出库', color: '#e0a030' }
        ],
        diff: r => r['碳酸钠仓库出库'] - r['碳酸钠车间消耗'],
        gen: rnd => { const a = 12 + rnd() * 8; return { '碳酸钠车间消耗': +a.toFixed(2), '碳酸钠仓库出库': +(a + (rnd() - 0.5) * 4).toFixed(2) }; }
    },
    drain: {
        name: '外排水', unit: 'm³',
        cols: [
            { title: '日期', field: '日期' },
            { title: '外排水量', field: '外排水量' }
        ],
        series: [{ field: '外排水量', name: '外排水量', color: '#2b579a' }],
        diff: null,
        gen: rnd => ({ '外排水量': +(180 + rnd() * 160).toFixed(2) })
    }
};

const DATA = {};
Object.keys(METRICS).forEach((k, i) => {
    const rnd = rndGen(2026 + i * 31);
    DATA[k] = DATES.map(d => Object.assign({ '日期': d }, METRICS[k].gen(rnd)));
});

let curKey = 'lithium';
let sortState = { field: '日期', asc: true };
const fmt = v => Number(v || 0).toFixed(2);
const chart = echarts.init(document.getElementById('chart'));
new ResizeObserver(() => chart.resize()).observe(document.querySelector('.p-body'));

function renderKpi() {
    const m = METRICS[curKey], rows = DATA[curKey];
    const sum = f => rows.reduce((s, r) => s + (r[f] || 0), 0);
    const cards = [];
    cards.push(`<div class="kpi-card"><div class="kpi-label">当前指标</div>
        <div class="kpi-value" style="font-size:17px;">${m.name}<span class="kpi-range">2026-09-30 ~ 2026-10-27</span></div></div>`);

    if (curKey === 'sulfate') {
        // 「硫酸钠日累计合计」卡片已按用户要求移除
        cards.push(`<div class="kpi-card"><div class="kpi-label">料总合计(干+湿+杂+落地)</div><div class="kpi-value">${fmt(sum('硫酸钠干料') + sum('硫酸钠湿料') + sum('硫酸钠杂质料') + sum('硫酸钠落地料'))}<small>t</small></div></div>`);
    } else {
        const f = curKey === 'lithium' ? '碳酸锂车间产出' : curKey === 'carbonate' ? '碳酸钠车间消耗' : '外排水量';
        cards.push(`<div class="kpi-card"><div class="kpi-label">${f}合计</div><div class="kpi-value">${fmt(sum(f))}<small>${m.unit}</small></div></div>`);
        if (curKey !== 'drain') {
            const bf = curKey === 'lithium' ? '碳酸锂仓库出库' : '碳酸钠仓库出库';
            cards.push(`<div class="kpi-card"><div class="kpi-label">仓库出库合计</div><div class="kpi-value">${fmt(sum(bf))}<small>t</small></div></div>`);
        }
    }
    if (m.diff) {
        const d = rows.reduce((s, r) => s + m.diff(r), 0);
        cards.push(`<div class="kpi-card"><div class="kpi-label">差值(出库−产出)</div><div class="kpi-value ${d < 0 ? 'neg' : ''}">${d > 0 ? '+' : ''}${fmt(d)}<small>${m.unit}</small></div></div>`);
    }
    if (curKey === 'lithium' || curKey === 'sulfate') {
        const plan = curKey === 'lithium' ? 900 : 1200;
        const done = sum(curKey === 'lithium' ? '碳酸锂车间产出' : '硫酸钠');
        const pct = Math.min(100, Math.round(done / plan * 100));
        cards.push(`<div class="kpi-card plan"><div class="kpi-label" style="color:#2b579a;">10月计划完成率</div>
            <div style="display:flex;align-items:center;gap:12px;">
                <div class="plan-track" style="flex:1;"><div class="plan-fill" style="width:${pct}%"></div></div>
                <span class="plan-pct">${pct}%</span></div>
            <div class="plan-foot">计划 ${plan} t · 已完成 ${fmt(done)} t</div></div>`);
    }
    document.getElementById('kpiRow').innerHTML = cards.join('');
}

function renderTable() {
    const m = METRICS[curKey];
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');
    const foot = document.getElementById('tableFoot');
    document.getElementById('dataTable').dataset.cols = m.cols.length;
    document.getElementById('tableCount').innerText = `共 ${DATA[curKey].length} 条记录`;

    head.innerHTML = '<tr>' + m.cols.map(c => {
        const sortable = !c.isDiff;
        return `<th class="${c.isDiff ? 'col-sep' : ''}" data-field="${c.field}" data-sortable="${sortable ? 1 : 0}">
            ${c.title}${sortable ? `<span class="sort">${sortState.field === c.field ? (sortState.asc ? '↑' : '↓') : '↕'}</span>` : ''}</th>`;
    }).join('') + '</tr>';

    head.querySelectorAll('th[data-sortable="1"]').forEach(th => {
        th.onclick = () => {
            const f = th.dataset.field;
            if (sortState.field === f) sortState.asc = !sortState.asc;
            else sortState = { field: f, asc: f === '日期' };
            renderTable();
        };
    });

    const list = [...DATA[curKey]].sort((a, b) => {
        const f = sortState.field;
        const cmp = f === '日期' ? String(a[f]).localeCompare(String(b[f])) : (a[f] || 0) - (b[f] || 0);
        return sortState.asc ? cmp : -cmp;
    });

    body.innerHTML = list.map(r => '<tr>' + m.cols.map(c => {
        if (c.isDiff) {
            const v = m.diff ? m.diff(r) : 0;
            const cls = Math.abs(v) < 0.0001 ? 'zero' : (v < 0 ? 'neg' : 'pos');
            return `<td class="col-sep"><span class="pill ${cls}">${v > 0 ? '+' : ''}${fmt(v)}</span></td>`;
        }
        if (c.field === '日期') return `<td>${r['日期']}</td>`;
        return `<td>${fmt(r[c.field])}</td>`;
    }).join('') + '</tr>').join('');

    let fh = '<tr>';
    m.cols.forEach((c, i) => {
        if (i === 0) { fh += '<td>合计</td>'; return; }
        if (c.isDiff) {
            const t = m.diff ? list.reduce((s, r) => s + m.diff(r), 0) : 0;
            const cls = Math.abs(t) < 0.0001 ? '' : (t < 0 ? 'tf-neg' : 'tf-pos');
            fh += `<td class="col-sep ${cls}">${t > 0 ? '+' : ''}${fmt(t)}</td>`;
        } else {
            fh += `<td>${fmt(list.reduce((s, r) => s + (r[c.field] || 0), 0))}</td>`;
        }
    });
    foot.innerHTML = fh + '</tr>';
}

function renderChart() {
    const m = METRICS[curKey], rows = DATA[curKey];
    chart.setOption({
        color: m.series.map(s => s.color),
        tooltip: {
            trigger: 'axis',
            formatter: ps => {
                const r = rows[ps[0].dataIndex];
                let h = `<div style="font-weight:600;margin-bottom:3px;">${r['日期']}</div>`;
                ps.forEach(p => h += `${p.marker}${p.seriesName}：${fmt(p.value)}<br/>`);
                if (m.diff) {
                    const d = m.diff(r);
                    h += `<div style="margin-top:3px;color:${d < 0 ? '#ffb4ad' : '#9fe3bf'};font-weight:600;">当日差值：${d > 0 ? '+' : ''}${fmt(d)}</div>`;
                }
                return h;
            }
        },
        legend: { top: 4, itemWidth: 12, itemHeight: 8, textStyle: { fontSize: 12, color: '#6b7280' } },
        grid: { left: 8, right: 18, top: 40, bottom: 50, containLabel: true },
        xAxis: {
            type: 'category', boundaryGap: false, data: rows.map(r => r['日期']),
            axisLine: { lineStyle: { color: '#e2e7ef' } }, axisTick: { show: false },
            axisLabel: { fontSize: 11, color: '#8a94a3', formatter: v => v.slice(5) }
        },
        yAxis: {
            type: 'value', name: m.unit, nameTextStyle: { color: '#9aa3b0', fontSize: 11 },
            axisLine: { show: false }, axisTick: { show: false },
            axisLabel: { fontSize: 11, color: '#8a94a3' },
            splitLine: { lineStyle: { color: '#f0f3f7' } }
        },
        dataZoom: [{ type: 'slider', height: 16, bottom: 10, start: 0, end: 100 }],
        series: m.series.map(s => ({
            name: s.name, type: 'line', smooth: true, symbol: 'circle', symbolSize: 5,
            data: rows.map(r => r[s.field]), itemStyle: { color: s.color },
            lineStyle: { width: 2.4 }, areaStyle: { opacity: .10 }
        }))
    }, true);
}

function renderAll() {
    const m = METRICS[curKey];
    document.getElementById('chartTitle').innerText = m.name + '趋势';
    document.getElementById('chartSub').innerText = '按日 · 单位 ' + m.unit;
    renderKpi(); renderChart(); renderTable();
}

document.querySelectorAll('#metricGroup button').forEach(btn => {
    btn.onclick = () => {
        curKey = btn.dataset.key;
        sortState = { field: '日期', asc: true };
        document.querySelectorAll('#metricGroup button').forEach(b => b.classList.toggle('active', b === btn));
        renderAll();
    };
});

renderAll();
</script>
</body>
</html>
